---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

name: "Codeql Analysis"

run-name: >-
    Codeql Analysis • ${{ github.event_name }} • ${{
        github.event.pull_request.number || github.ref_name || github.sha
    }}

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"
    schedule:
        - cron: "27 4 * * 1"

concurrency:
    group: "codeql-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    actions: "read"
    contents: "read"
    security-events: "write"

jobs:
    analyze:
        name: "Analyze"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Checkout"
              uses: >-
                  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: "Initialize CodeQL"
              uses: >-
                  github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
              with:
                  languages: "javascript-typescript"

            - name: "Perform CodeQL analysis"
              uses: >-
                  github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
