---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:truthy

name: "Continuous Integration"

run-name: >-
    Continuous Integration • ${{ github.event_name }} • ${{
        github.event.pull_request.number || github.ref_name || github.sha
    }}

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions: {}

jobs:
    node-test-matrix:
        name: "Node.js matrix"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        env:
            CI: "true"
        defaults:
            run:
                shell: "bash"
        steps:
            - name: "Harden runner (Ubuntu only)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c" # v2.21.0
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup npm"
              working-directory: "${{ runner.temp }}"
              run: |
                  npm install --global --ignore-scripts npm@12.0.2
                  npm --version

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build"
              run: "npm run build --if-present"

            - name: "Typecheck"
              run: "npm run typecheck --if-present"

            - name: "Run tests with coverage"
              run: "npm test --if-present"

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() && matrix.os == 'ubuntu-latest' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "coverage-${{ matrix.codecov_flag }}"
                  fail_ci_if_error: true

    release-verify:
        name: "Release verification"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            contents: "read"
        defaults:
            run:
                shell: "bash"
        steps:
            - name: "Checkout"
              uses: >-
                  actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

            - name: "Setup Node"
              uses: >-
                  actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Setup npm"
              working-directory: "${{ runner.temp }}"
              run: |
                  npm install --global --ignore-scripts npm@12.0.2
                  npm --version

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Verify release readiness"
              run: "npm run release:check"
